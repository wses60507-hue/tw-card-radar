name: Auto Update Taiwan Credit Cards
on:
  schedule:
    - cron: "0 1 1,15 * *"   # 每月 1 號與 15 號 台灣時間 09:00 自動執行
  workflow_dispatch:         # 允許隨時手動點按鈕立即更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-genai
      - name: Fetch latest card rewards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_cards.py
      - name: Commit updated cards.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards.json
          git diff --cached --quiet || git commit -m "chore: auto-update credit card rewards"
          git push
